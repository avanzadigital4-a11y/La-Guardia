name: pruebas

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  suites:
    name: Suites automáticas (Godot 4.3 headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cachear el binario de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.3-stable-linux

      - name: Descargar Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64

      - name: Importar el proyecto
        run: ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --import

      - name: Integridad del contenido
        run: ./tools/test.sh content

      - name: Recorrido completo
        run: ./tools/test.sh playthrough

      - name: Interfaz
        run: ./tools/test.sh ui_smoke

      - name: Medición de ritmo (informativa)
        continue-on-error: true
        run: ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . res://tests/pacing.tscn
